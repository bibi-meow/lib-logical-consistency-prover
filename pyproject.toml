[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-logical-consistency-prover"
version = "0.1.0"
description = "Proves logical consistency between software specifications and code using SMT and heuristics"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "pyright"]
smt = ["z3-solver"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib_logical_consistency_prover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
