[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-logical-consistency-prover"
version = "0.1.0"
description = "Formal logical consistency verification between specifications and code"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
]

[project.optional-dependencies]
smt = ["z3-solver>=4.12"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "pyright>=1.1", "z3-solver>=4.12", "networkx>=3.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib_logical_consistency_prover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.11"
include = ["lib_logical_consistency_prover"]
strict = []
